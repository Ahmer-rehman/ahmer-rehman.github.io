name: Auto Commit Activity

on:
  schedule:
    # Once daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      commits:
        description: "Number of commits (20-30)"
        required: false
        default: "25"

permissions:
  contents: write

concurrency:
  group: auto-commit
  cancel-in-progress: false

jobs:
  autopush:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create daily activity commits
        run: |
          mkdir -p automation

          if [ -n "${{ github.event.inputs.commits }}" ]; then
            COMMITS="${{ github.event.inputs.commits }}"
          else
            COMMITS=$((20 + RANDOM % 11))
          fi

          echo "Creating ${COMMITS} commits for $(date -u +%Y-%m-%d)"

          for i in $(seq 1 "$COMMITS"); do
            echo "$(date -u +"%Y-%m-%dT%H:%M:%SZ") activity #${i}" >> automation/activity.txt
            git add automation/activity.txt
            git commit -m "chore: daily activity update (${i}/${COMMITS})"
          done

      - name: Push to main
        run: git push origin main
